name: Update 3D contribution city

on:
  schedule:
    # 03:17 Asia/Shanghai
    - cron: '17 19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/profile-3d.yml'
      - '.github/profile-3d-settings.json'

permissions:
  contents: read

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate night-green contribution city
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Validate generated SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('profile-3d-contrib/profile-night-green.svg')
          content = '\n'.join(line.rstrip() for line in path.read_text().splitlines())
          path.write_text(content.rstrip() + '\n')
          root = ET.parse(path).getroot()
          assert root.tag == '{http://www.w3.org/2000/svg}svg'
          assert path.stat().st_size > 1024
          assert root.findall('.//{http://www.w3.org/2000/svg}path')
          print(f'Valid 3D contribution SVG, {path.stat().st_size} bytes')
          PY

      - name: Commit updated contribution city
        run: |
          git add profile-3d-contrib/profile-night-green.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Contribution city is up to date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(主页): 更新夜景3D贡献图'
          git push origin HEAD:main
